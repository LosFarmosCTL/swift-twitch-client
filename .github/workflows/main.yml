name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  XCODE_VERSION: "27.0"

defaults:
  run:
    shell: bash

jobs:
  build:
    name: Build + Test (${{ matrix.os }}, Swift ${{ matrix.swift-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            swift-version: "6.4"
          - os: xcode-27
            swift-version: "6.4"

    steps:
      - uses: actions/checkout@v5

      - name: Select Xcode
        if: runner.os == 'macOS'
        run: sudo xcode-select --switch "/Applications/Xcode_${XCODE_VERSION}.app/Contents/Developer"

      - name: Install Swift on Linux
        if: runner.os == 'Linux'
        env:
          SWIFT_VERSION: ${{ matrix.swift-version }}
        run: |
          if swift --version 2>/dev/null | grep -Eq "Swift version ${SWIFT_VERSION//./\\.}([.[:space:]]|$)"; then
            exit 0
          fi

          curl --fail --location --retry 3 \
            "https://download.swift.org/swiftly/linux/swiftly-$(uname -m).tar.gz" \
            --output "$RUNNER_TEMP/swiftly.tar.gz"
          tar -xzf "$RUNNER_TEMP/swiftly.tar.gz" -C "$RUNNER_TEMP"
          "$RUNNER_TEMP/swiftly" init --assume-yes --skip-install
          source "$HOME/.local/share/swiftly/env.sh"
          swiftly install "$SWIFT_VERSION" --post-install-file="$RUNNER_TEMP/swift-post-install.sh"
          if [[ -f "$RUNNER_TEMP/swift-post-install.sh" ]]; then
            sudo apt-get update
            sudo bash "$RUNNER_TEMP/swift-post-install.sh"
          fi
          swiftly use "$SWIFT_VERSION"
          echo "$SWIFTLY_BIN_DIR" >> "$GITHUB_PATH"

      - name: Show and verify Swift version
        env:
          SWIFT_VERSION: ${{ matrix.swift-version }}
        run: |
          swift --version
          swift --version | grep -E "Swift version ${SWIFT_VERSION//./\\.}([.[:space:]]|$)"

      - name: Cache Swift build
        uses: actions/cache@v4
        with:
          path: .build
          key: build-${{ runner.os }}-${{ runner.arch }}-toolchain${{ matrix.swift-version || env.XCODE_VERSION }}-${{ hashFiles('Package.resolved') }}
          restore-keys: |
            build-${{ runner.os }}-${{ runner.arch }}-toolchain${{ matrix.swift-version || env.XCODE_VERSION }}-

      - name: Build
        run: swift build --force-resolved-versions

      - name: Test
        run: swift test --force-resolved-versions

  ios:
    name: iOS Simulator Build
    runs-on: xcode-27
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - name: Select Xcode
        run: sudo xcode-select --switch "/Applications/Xcode_${XCODE_VERSION}.app/Contents/Developer"

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Install build tools
        run: brew install xcbeautify

      - name: Build package for iOS Simulator
        run: |
          mkdir -p artifacts
          xcodebuild build \
            -scheme swift-twitch-client \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/TwitchDerivedData" \
            -resultBundlePath artifacts/Build.xcresult \
            -onlyUsePackageVersionsFromResolvedFile \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee artifacts/build.log | xcbeautify --renderer github-actions

      - name: Upload build diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-diagnostics
          path: artifacts/
          if-no-files-found: ignore
          retention-days: 7

  lint:
    name: Lint
    runs-on: xcode-27
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - name: Select Xcode
        run: sudo xcode-select --switch "/Applications/Xcode_${XCODE_VERSION}.app/Contents/Developer"

      - name: Install SwiftLint
        run: brew install swiftlint

      - name: Check lint (including warnings)
        run: |
          swiftlint version
          git ls-files -z -- '*.swift' | xargs -0 swiftlint lint --strict --reporter github-actions-logging

  format:
    name: Check formatting
    runs-on: xcode-27
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - name: Select Xcode
        run: sudo xcode-select --switch "/Applications/Xcode_${XCODE_VERSION}.app/Contents/Developer"

      - name: Check formatting
        run: |
          swift --version
          git ls-files -z -- '*.swift' | xargs -0 swift format lint --strict --configuration .swift-format

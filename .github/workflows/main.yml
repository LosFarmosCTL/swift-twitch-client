name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  build:
    name: Build + Test (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: Linux, Swift 6.4
            container: swift:6.4
          - os: xcode-27
            name: macOS, Xcode 27
            container: ""
    steps:
      - uses: actions/checkout@v5

      - name: Show Swift version
        run: swift --version

      - name: Build
        run: swift build --force-resolved-versions

      - name: Test
        run: swift test --force-resolved-versions

  ios:
    name: iOS Simulator Build
    runs-on: xcode-27
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Install build tools
        run: brew install xcbeautify

      - name: Build package for iOS Simulator
        run: |
          mkdir -p artifacts
          xcodebuild build \
            -scheme swift-twitch-client \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/TwitchDerivedData" \
            -resultBundlePath artifacts/Build.xcresult \
            -onlyUsePackageVersionsFromResolvedFile \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee artifacts/build.log | xcbeautify --renderer github-actions

      - name: Upload build diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: ios-build-diagnostics
          path: artifacts/
          if-no-files-found: ignore
          retention-days: 7

  lint:
    name: Lint
    runs-on: xcode-27
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - name: Install SwiftLint
        run: brew install swiftlint

      - name: Check lint (including warnings)
        run: |
          swiftlint version
          git ls-files -z -- '*.swift' | xargs -0 swiftlint lint --strict --reporter github-actions-logging

  format:
    name: Check formatting
    runs-on: xcode-27
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - name: Check formatting
        run: |
          swift --version
          git ls-files -z -- '*.swift' | xargs -0 swift format lint --strict --configuration .swift-format

  ci-passed:
    name: CI passed
    if: ${{ always() && github.event_name == 'pull_request' }}
    needs: [build, ios, lint, format]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every CI job to succeed
        env:
          JOB_RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$JOB_RESULTS" | jq .
          echo "$JOB_RESULTS" | jq --exit-status 'all(.[]; .result == "success")'

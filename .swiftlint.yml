disabled_rules:
  - trailing_comma
  - opening_brace
  - closure_parameter_position
  - todo
  - large_tuple

excluded:
  - .build

line_length:
  # DocC link destinations cannot be split; keep all surrounding prose wrapped.
  excluded_lines_patterns:
    - '^\s*/// https://\S+$'

nesting:
  type_level:
    warning: 2
